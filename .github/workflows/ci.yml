name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Module Hygiene (Zero Dependencies)
        run: |
          go mod verify
          if grep -E '^\s*require(\s|\()' go.mod; then
            echo "ERROR: Untrusted 3rd-party dependencies detected in go.mod! NIS2/DORA supply-chain policy requires pure standard library."
            exit 1
          fi

      - name: Run Tests with Race Detector
        run: |
          go test -race -v ./...

      - name: Build CLI Binary (Zero CGO)
        run: |
          CGO_ENABLED=0 go build -v ./cmd/zfspulse
